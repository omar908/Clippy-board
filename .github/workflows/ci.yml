name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Validate release versions and policy
        run: |
          node scripts/release-plan.mjs --check
          npm run test:release

      - name: Run frontend tests
        run: npm test

      - name: Typecheck browser layout tests
        run: npm run typecheck:layout

      - name: Install Chromium for layout tests
        run: npx playwright install chromium

      - name: Run browser layout tests
        run: npm run test:layout

      - name: Upload browser layout diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-layout-results
          path: |
            playwright-report/
            test-results/layout/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets --timings

      - name: Build debug binary with embedded assets (for smoke test)
        # `cargo build` alone points at the Vite dev server; the Tauri CLI's
        # debug build embeds dist/ while still compiling with the fast profile.
        # Keep flags inside the npm script: Windows/npm can swallow forwarded flags.
        # Its beforeBuildCommand also typechecks/builds the frontend, once.
        run: npm run build:debug

      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-timings
          path: src-tauri/target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run CDP smoke test
        run: ./scripts/run-smoke.ps1 -Exe src-tauri/target/debug/clippy.exe -Seed

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: src-tauri/target/smoke-logs/
          if-no-files-found: ignore

  release_plan:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plan release for the tested commit
        id: plan
        run: node scripts/release-plan.mjs

  release:
    # A version bump merged into main tags/releases this tested commit. Tag and
    # release creation stay in one run: GITHUB_TOKEN tags do not trigger CI again.
    needs: [test, release_plan]
    if: needs.release_plan.outputs.build == 'true'
    runs-on: windows-latest
    concurrency:
      group: release-${{ needs.release_plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build signed release
        if: needs.release_plan.outputs.publish == 'true'
        run: npm run build:release:signed
        env:
          CI: true
          CLIPPY_RELEASE_TAG: ${{ needs.release_plan.outputs.tag }}
          TAURI_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app (manual run)
        if: needs.release_plan.outputs.publish != 'true'
        run: npm run tauri build
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clippy-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/clippy.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/latest.json
          if-no-files-found: ignore

      - name: Publish GitHub Release
        # The release API creates the tag at the exact tested commit if absent.
        # Manual runs still only produce build artifacts.
        if: needs.release_plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release_plan.outputs.tag }}
          target_commitish: ${{ needs.release_plan.outputs.commit }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/latest.json
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
