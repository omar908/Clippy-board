name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend (typecheck + vite)
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      - name: Build debug binary with embedded assets (for smoke test)
        # `cargo build` alone points at the Vite dev server; the Tauri CLI's
        # debug build embeds dist/ while still compiling with the fast profile.
        run: npm run tauri build -- --debug --no-bundle

      - name: Run CDP smoke test
        run: ./scripts/run-smoke.ps1 -Exe src-tauri/target/debug/clippy.exe -Seed

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: src-tauri/target/smoke-logs/
          if-no-files-found: ignore

  release:
    # Release builds only for version tags or a manual run, never for ordinary
    # pushes/PRs. CI still runs the full test + smoke job in those cases.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (release)
        run: npm run tauri build
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clippy-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/clippy.exe
          if-no-files-found: ignore

      - name: Publish GitHub Release
        # Only for tag pushes; manual runs just produce the artifact above.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: true
          generate_release_notes: true